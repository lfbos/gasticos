services:
  db:
    image: postgres:16-alpine
    container_name: gastico-db
    environment:
      POSTGRES_USER: gastico
      POSTGRES_PASSWORD: gastico_dev
      POSTGRES_DB: gastico
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastico"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gastico-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: gastico-backend
    environment:
      DATABASE_URL: postgres://gastico:gastico_dev@db:5432/gastico
      REDIS_URL: redis://redis:6379
      RUST_LOG: debug
      JWT_SECRET: dev_jwt_secret_change_in_production
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    container_name: gastico-worker
    environment:
      DATABASE_URL: postgres://gastico:gastico_dev@db:5432/gastico
      REDIS_URL: redis://redis:6379
      RUST_LOG: debug
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: gastico-frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  cargo_cache:
  target_cache:
